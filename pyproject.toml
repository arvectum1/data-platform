[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "arvectum-data-platform"
version = "0.6.0"
description = "Domain-neutral acquisition, lifecycle-managed learned discovery and governed extraction pipeline for Arvectum Data Platform"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.3"]
browser = ["playwright>=1.40"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"
